{{ define "main" }}
  <div class="p-page">
    <header class="p-page__header">
      <h1 class="p-page__title">{{ .Title }}</h1>
    </header>

    <div class="p-page__content">
      {{ .Content }}

      <div>
        {{ range .Pages }}
          <article class="p-card">
            <h2 class="p-card__title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>
          </article>
        {{ end }}
      </div>
    </div>
  </div>
{{ end }}
